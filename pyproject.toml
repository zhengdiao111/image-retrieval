[project]
name = "image-retrieval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zhengdiao111", email = "81383738+zhengdiao111@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "lancedb>=0.39.0",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.64.0",
    "torch==2.14.1",
    "transformers>=5.18.0",
    "watchdog>=6.0.0",
]

[project.scripts]
image-retrieval = "image_retrieval:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true